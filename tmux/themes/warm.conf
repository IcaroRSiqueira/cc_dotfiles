# Warm theme (VSCode-inspired) — dark bar
# palette: dark=#2d2d2d | red=#b11e14 | cream=#f2f0e3 | muted=#85827a

set -g status-style "fg=#f2f0e3,bg=#2d2d2d"
set -g pane-border-style "fg=#85827a"
set -g pane-active-border-style "fg=#b11e14"
set -g message-style "fg=#f2f0e3,bg=#b11e14,bold"

# Left: [red: ❖ session]▶[dark: whoami]
set -g status-left '#[fg=#f2f0e3,bg=#b11e14,bold] ❖ #S #[fg=#b11e14,bg=#2d2d2d,nobold]▶#[fg=#f2f0e3,bg=#2d2d2d] #(whoami) '

# Inactive windows
set -g window-status-format "#[fg=#85827a,bg=#2d2d2d] #I #W "

# Active window: ▶[red: content]▶
set -g window-status-current-format "#[fg=#2d2d2d,bg=#b11e14]▶#[fg=#f2f0e3,bg=#b11e14,bold] #I: #W #[fg=#b11e14,bg=#2d2d2d,nobold]▶"

# Right: hostname + date
set -g @batt_icon_status_unknown '🔌'
set-option -g status-right "#{?#{m:copy-mode*,#{pane_mode}},#[fg=#2d2d2d,bg=colour220,bold] COPY MODE ,}#[fg=#f2f0e3,bg=#2d2d2d] #(cd #{pane_current_path} && mise current ruby 2>/dev/null | sed 's/^/ruby-/') #(cd #{pane_current_path} && mise current node 2>/dev/null | sed 's/^/node-/') #[fg=colour228]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null)#[fg=#85827a] #(cd #{pane_current_path} && git rev-parse --short HEAD 2>/dev/null)#[fg=colour220]#(cd #{pane_current_path} && git diff --quiet 2>/dev/null || echo ' ✗')#[fg=#85827a]  ≋ #[fg=#f2f0e3]#(cut -d' ' -f1-3 /proc/loadavg) "
